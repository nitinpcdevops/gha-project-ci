name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python with pip caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python files (fail on syntax errors)
        run: |
          python -m compileall -q pixelpost || {
            echo "Python syntax errors found during compilation in pixelpost/"
            exit 1
          }

      - name: Run pytest and generate JUnit XML
        run: |
          pytest --junitxml=test-results.xml
        continue-on-error: true

      - name: Upload test-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
